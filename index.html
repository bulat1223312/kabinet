<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F2F8">
<title>Кабинет репетитора</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317141F'/%3E%3Ccircle cx='27' cy='27' r='11' fill='%236B4EFF'/%3E%3Crect x='11' y='11' width='10' height='10' rx='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preload" href="inter-400.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:Inter;src:url(inter-400.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(inter-600.woff) format('woff');font-weight:500 700;font-display:swap}
@font-face{font-family:'Inter Display';src:url(inter-display-800.woff) format('woff');font-weight:800;font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#F3F2F8;--sf:#fff;--sf2:#F7F6FB;--ink:#17141F;--ink2:#4A4658;--mut:#878396;--line:#E6E3EE;
 --vio:#6B4EFF;--vio-d:#5233EE;--vio-l:#EEEAFF;--mint:#0E9F74;--mint-b:#13C08E;--mint-l:#E0F6EE;--red:#E3344C;--red-l:#FDE7EA;--amber:#A56A00;--amber-l:#FFF2CF;
 --ease:cubic-bezier(.2,.8,.2,1);--sh:0 1px 2px rgba(23,20,31,.04),0 10px 30px -18px rgba(23,20,31,.25);--shf:0 2px 6px rgba(23,20,31,.06),0 22px 44px -18px rgba(23,20,31,.32);
 --f:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--fd:"Inter Display",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono","Liberation Mono",monospace}
html,body{margin:0;min-height:100%}
body{font:15px/1.5 var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","calt";font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.1}
h1{font:800 clamp(34px,5.4vw,56px)/1.02 var(--fd);letter-spacing:-.035em}
h2{font:800 24px/1.1 var(--fd);letter-spacing:-.02em}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
h4{font-size:13px;font-weight:600;color:var(--mut)}
a{color:inherit;text-decoration:none}
p{margin:0}
:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
::selection{background:#D9D0FF}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
button,.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--sf);color:var(--ink);height:40px;padding:0 15px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .15s var(--ease),background .15s,border-color .15s,box-shadow .2s,color .15s}
button:hover,.btn:hover{border-color:#CFC9DF;background:#FCFBFF}
button:active,.btn:active{transform:scale(.96)}
button:disabled{opacity:.5;cursor:default;transform:none}
button.pri{background:var(--vio);border-color:var(--vio);color:#fff;box-shadow:0 8px 20px -10px rgba(107,78,255,.9)}
button.pri:hover{background:var(--vio-d);border-color:var(--vio-d)}
button.dark{background:var(--ink);border-color:var(--ink);color:#fff}
button.dark:hover{background:#2A2536}
button.danger{color:var(--red)}button.danger:hover{background:var(--red-l);border-color:#F4B8C1}
button.pri.dng{background:var(--red);border-color:var(--red);box-shadow:0 8px 20px -10px rgba(227,52,76,.8)}
button.ghost{background:transparent;border-color:transparent}button.ghost:hover{background:rgba(23,20,31,.05)}
button.mini{height:32px;padding:0 11px;font-size:13px;border-radius:10px}
button.icb{width:40px;padding:0}button.mini.icb{width:32px}
input,textarea,select{font:inherit;width:100%;height:44px;padding:0 13px;border:1px solid transparent;border-radius:12px;background:var(--sf2);color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
textarea{height:auto;min-height:96px;padding:11px 13px;resize:vertical;line-height:1.45}
input:hover,textarea:hover{background:#F2F0F8}
input:focus,textarea:focus,select:focus{outline:none;background:#fff;border-color:var(--vio);box-shadow:0 0 0 4px rgba(107,78,255,.14)}
input[type=range]{height:auto;padding:0;background:none;border:0;box-shadow:none;accent-color:var(--vio)}
select{cursor:pointer}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 0}
label input,label textarea{margin-top:6px;font-weight:400;font-size:15px}
/* шапка и сетка кабинета */
.nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:18px 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;margin-right:auto}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--ink);display:grid;place-items:center;position:relative;overflow:hidden}
.logo i::before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--vio);right:-5px;bottom:-5px}
.logo i::after{content:"";width:10px;height:10px;border-radius:3px;background:#fff;position:relative}
.wrap{max-width:1200px;margin:0 auto;padding:6px 24px 64px}
.back{color:var(--ink2);font-weight:600;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.back:hover{color:var(--vio)}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:22px;align-items:stretch;margin:18px 0 34px}
.hero .date{color:var(--mut);font-weight:600;margin-bottom:14px}
.hero .sub{color:var(--ink2);margin-top:14px;font-size:17px}
.next{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:28px;padding:24px 26px;display:flex;flex-direction:column;gap:4px;min-height:200px;isolation:isolate}
.next::before{content:"";position:absolute;z-index:-1;width:230px;height:230px;border-radius:50%;background:var(--vio);right:-70px;top:-90px}
.next::after{content:"";position:absolute;z-index:-1;width:90px;height:90px;border-radius:24px;background:var(--mint-b);right:38px;bottom:-34px;transform:rotate(18deg)}
.next .lbl{color:#B9B3CC;font-weight:600;font-size:14px}
.next .who{font:800 34px/1.05 var(--fd);letter-spacing:-.03em;margin-top:10px}
.next .when{color:#DCD6F0;font-size:16px}
.next .row2{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:18px;flex-wrap:wrap}
.next .cd{background:rgba(255,255,255,.12);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.next .cd.now{background:var(--mint-b);color:#06261C}
.next button.pri{box-shadow:none}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:22px;align-items:start}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel{background:var(--sf);border-radius:24px;padding:22px;box-shadow:var(--sh)}
.panel>h3:first-child{margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.card{background:var(--sf);border-radius:22px;padding:18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:14px;transition:transform .22s var(--ease),box-shadow .22s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shf)}
.card .tp{display:flex;gap:12px;align-items:center;min-width:0}
.card .tp div{min-width:0}
.card b{font-size:16px;display:block}
.card .goal{color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;font:800 19px/1 var(--fd);flex:none;transition:transform .25s var(--ease)}
.av.big{width:72px;height:72px;border-radius:22px;font-size:30px}
.card:hover .av{transform:rotate(-7deg) scale(1.05)}
.addcard{border:2px dashed #D6D1E4;background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--ink2);font-weight:600;min-height:118px;cursor:pointer;flex-direction:row}
.addcard:hover{border-color:var(--vio);color:var(--vio);transform:none;box-shadow:none}
.empty{color:var(--mut)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.col{display:grid;gap:22px}
.shead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:16px 0 28px}
.shead h1{font-size:clamp(32px,4.6vw,48px)}
.shead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.link{display:flex;gap:8px;margin-top:8px}
.hint{font-size:13px;color:var(--mut);margin:8px 0 14px;line-height:1.45}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:11px 0;transition:opacity .22s,transform .22s var(--ease)}
.list li:first-child{border-top:0}
.list li.gone{opacity:0;transform:translateX(20px)}
.boards a{flex:1;display:flex;flex-direction:column;min-width:0}.boards a:hover b{color:var(--vio)}.boards small{color:var(--mut)}
.when{min-width:136px}.when b{font-weight:600}
.who{color:var(--vio);font-weight:600}.who:hover{text-decoration:underline;text-underline-offset:3px}
.grow{flex:1}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--vio-l);color:var(--vio-d);white-space:nowrap}
.chip.ok{background:var(--mint-l);color:var(--mint)}.chip.neg{background:var(--red-l);color:var(--red)}.chip.warn{background:var(--amber-l);color:var(--amber)}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.form input{width:auto;flex:1;min-width:96px}.form input[type=number]{max-width:96px}
.form span{font-size:13px;color:var(--mut)}
.sum{font-size:14px;margin:8px 0 0;color:var(--ink2)}.sum b{color:var(--ink)}
.cells{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 4px}
.cells i{width:20px;height:20px;border-radius:7px;background:var(--vio);animation:pop .35s var(--ease) both}
.cells i.p{background:transparent;box-shadow:inset 0 0 0 2px var(--vio)}.cells i.x{background:var(--red)}
.joinbox{max-width:400px;margin:14vh auto 0;background:#fff;border-radius:26px;padding:30px;box-shadow:var(--shf)}
.joinbox h2{margin-bottom:6px}
.joinbox button{width:100%;margin-top:18px;height:46px}
.joinbox.shake{animation:shake .36s}
.hwbig{white-space:pre-wrap;margin-top:12px;padding:14px 16px;background:var(--vio-l);border-radius:16px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--vio-l);border-top-color:var(--vio);animation:spin .8s linear infinite;display:inline-block;vertical-align:-6px;margin-right:10px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(23,20,31,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .16s both}
.mbox{width:min(420px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 40px 80px -24px rgba(0,0,0,.5);animation:popin .24s var(--ease) both}
.mbox p{margin-top:8px;color:var(--mut)}.mbox input{margin-top:16px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal.out{animation:fade .14s reverse both}.modal.out .mbox{animation:popin .14s reverse both}
.toast{position:fixed;left:50%;bottom:28px;z-index:90;background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;max-width:min(90vw,520px);box-shadow:0 18px 36px -14px rgba(0,0,0,.5);animation:toast .28s var(--ease) both;transform:translateX(-50%);font-weight:500}
.toast.out{animation:toastout .2s both}
.enter .rise{animation:rise .5s var(--ease) both}
.enter .rise:nth-child(2){animation-delay:.06s}.enter .rise:nth-child(3){animation-delay:.12s}.enter .rise:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,10px)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,170,40,.55)}100%{box-shadow:0 0 0 10px rgba(245,170,40,0)}}
@keyframes livep{0%{box-shadow:0 0 0 0 rgba(19,192,142,.5)}100%{box-shadow:0 0 0 10px rgba(19,192,142,0)}}

/* ---------- комната урока ---------- */
.room{position:fixed;inset:0;background:#FBFBFD;overflow:hidden;animation:fade .25s both}
.stage{position:absolute;inset:0;touch-action:none;overflow:hidden}
.stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.ti{position:absolute;z-index:3;width:auto;min-width:180px;height:auto;padding:0 4px;border:1.5px dashed var(--vio);background:rgba(255,255,255,.95);border-radius:6px;box-shadow:none;line-height:1.2}
.fl{position:absolute;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(23,20,31,.07);border-radius:18px;box-shadow:var(--shf)}
.room button{height:38px;border-radius:12px;border-color:transparent;background:transparent;box-shadow:none;padding:0 11px;color:var(--ink)}
.room button:hover{background:rgba(23,20,31,.06);border-color:transparent}
.room button.act{background:var(--ink);color:#fff}
.room button.pri{background:var(--vio);color:#fff}.room button.pri:hover{background:var(--vio-d)}
.room select{height:38px;width:auto;padding:0 10px;border-radius:12px;background:rgba(23,20,31,.05);font-weight:600;font-size:14px}
.tl{top:12px;left:12px;display:flex;align-items:center;gap:4px;padding:5px;max-width:calc(100vw - 24px)}
.tl .ttl{font-weight:600;padding:0 6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}.tl .ttl span{font-weight:400;color:var(--mut);margin-left:6px}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;position:relative;background:rgba(23,20,31,.06);border-radius:13px;padding:3px;margin-left:4px}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:10px;background:#fff;box-shadow:0 2px 8px -2px rgba(23,20,31,.25);transition:transform .28s var(--ease)}
.seg.r::before{transform:translateX(100%)}
.room .seg button{position:relative;height:32px;padding:0 14px;color:var(--mut);background:none!important}
.room .seg button.act{color:var(--ink);background:none}
.tc{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px}
#pgl{min-width:96px;text-align:center;font-weight:600;font-size:14px}
.tr{top:12px;right:12px;display:flex;align-items:center;gap:4px;padding:5px 5px 5px 12px}
.stw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink2);max-width:300px}
.stw span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:#B6B1C4;flex:none}
.dot.wait{background:#F5AA28;animation:pulse 1.5s infinite}.dot.ok{background:var(--mint-b);animation:livep 2s infinite}.dot.err{background:var(--red)}
.dock{left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;max-width:calc(100vw - 180px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock button{width:40px;padding:0;flex:none}
.dock button.act{transform:translateY(-2px);box-shadow:0 8px 16px -8px rgba(23,20,31,.7)}
.sep{width:1px;height:24px;background:var(--line);margin:0 5px;flex:none}
.room .sw{width:26px;height:26px;border-radius:50%;padding:0;flex:none;margin:0 2px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);transition:transform .18s var(--ease)}
.room .sw:hover{transform:scale(1.15);background:inherit}
.room .sw.act{transform:scale(1.18);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);background:inherit}
#sz{width:72px;flex:none;margin:0 6px}
.zoom{right:12px;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px}
.room #zl{min-width:0;width:48px;padding:0;font-size:12px}
.vcard{right:12px;top:68px;width:268px;padding:8px;display:flex;flex-direction:column;gap:8px;transition:width .25s var(--ease)}
.vhead{display:flex;align-items:center;gap:8px;padding:0 2px 0 6px;font-size:13px;font-weight:600;color:var(--ink2)}
.vcard.min{width:auto}.vcard.min .vbody{display:none}
.vbody{display:flex;flex-direction:column;gap:8px}
.vid{position:relative}
.vid video{width:100%;background:#1D1A27;border-radius:13px;display:block;aspect-ratio:4/3;object-fit:cover}
#lv{position:absolute;width:33%;right:7px;bottom:7px;border:2px solid #fff;border-radius:10px;transform:scaleX(-1);box-shadow:0 6px 14px -4px rgba(0,0,0,.5)}
#rv{cursor:zoom-in}
#rv.big{position:fixed;z-index:30;inset:70px 292px 20px 20px;width:auto;height:calc(100vh - 90px);object-fit:contain;aspect-ratio:auto;cursor:zoom-out;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.vbtn{display:flex;gap:4px}
.vbtn button{flex:1;background:rgba(23,20,31,.05)}
.vbtn button.off{background:var(--red);color:#fff}
.vbtn button.act{background:var(--vio);color:#fff}
#vst{font-size:12px;color:var(--mut);padding:0 4px}
.hwbox{padding:4px 6px 4px}
.hwbox .hw{white-space:pre-wrap;font-size:14px;margin-top:4px;max-height:160px;overflow:auto}
.room.vmin .vcard{width:auto}
/* код */
.codev{position:absolute;inset:66px 12px 12px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:12px;animation:fade .2s both;padding-right:280px}
.room.vmin .codev,.room.ro .codev{padding-right:0}
.ed{background:#17141F;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;min-height:0;box-shadow:var(--shf)}
.edbar{display:flex;align-items:center;gap:6px;padding:10px;flex-wrap:wrap}
.room .ed .seg{background:rgba(255,255,255,.08)}
.room .ed .seg::before{background:#3A3352;box-shadow:none}
.room .ed .seg button{color:#9C96B2}.room .ed .seg button.act{color:#fff}
.room .ed button{color:#E9E6F5}.room .ed button:hover{background:rgba(255,255,255,.08)}
.room .ed button.pri{color:#fff;background:var(--vio)}.room .ed button.pri:hover{background:var(--vio-d)}
.room .ed button.stop:hover{background:#C92A40}
.room .ed button.stop{background:var(--red);color:#fff}
.keys{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 8px}
.room .keys button{height:28px;padding:0 9px;border-radius:8px;font:500 12.5px var(--fm);color:#CFC9E6;background:rgba(255,255,255,.06)}
.room .keys button:hover{background:rgba(255,255,255,.14)}
.edbody{flex:1;display:flex;min-height:0;border-top:1px solid rgba(255,255,255,.06)}
.gut{width:46px;flex:none;overflow:hidden;padding:14px 8px 14px 0;text-align:right;font:13.5px/1.65 var(--fm);color:#5E5874;white-space:pre;user-select:none}
.edw{position:relative;flex:1;min-width:0}
.edw pre,.edw textarea{position:absolute;inset:0;margin:0;padding:14px 16px 14px 6px;font:14.5px/1.65 var(--fm);white-space:pre;overflow:auto;tab-size:4;border:0;border-radius:0;letter-spacing:0;font-variant-ligatures:none;font-feature-settings:normal}
.edw pre{pointer-events:none;color:#ECE9F7;overflow:hidden}
.edw textarea{color:transparent;caret-color:#fff;background:transparent;resize:none;height:auto;min-height:0;box-shadow:none!important}
.edw textarea:focus,.edw textarea:hover{background:transparent;border:0}
.edw textarea::selection{background:rgba(124,99,255,.45);color:transparent}
.edw textarea::placeholder{color:#5E5874}
.hl .k{color:#B7A5FF;font-weight:600}.hl .b{color:#6FE0BE}.hl .s{color:#FFC978}.hl .n{color:#FF9DB5}.hl .c{color:#6F6987;font-style:italic}.hl .f{color:#8FD1FF}
.side2{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}

<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
/* ---------- КуМир: свой интерпретатор (школьное подмножество + Робот) ---------- */
const Kum=(()=>{
'use strict';
class KErr extends Error{constructor(line,msg){super(line?('Строка '+line+': '+msg):msg);this.line=line;this.kmsg=msg}}
const KW=new Set(['алг','нач','кон','арг','рез','аргрез','знач','цел','вещ','лог','лит','сим','целтаб','вещтаб','логтаб','литтаб','симтаб','таб','если','то','иначе','все','выбор','при','нц','кц','кц_при','пока','для','от','до','шаг','раз','выход','ввод','вывод','нс','утв','дано','надо','и','или','не','да','нет','использовать','стоп','div','mod']);
const TYPES={'цел':'цел','вещ':'вещ','лог':'лог','лит':'лит','сим':'сим'};
const TABS={'целтаб':'цел','вещтаб':'вещ','логтаб':'лог','литтаб':'лит','симтаб':'сим'};
const ROBOT_CMDS=['вверх','вниз','влево','вправо','закрасить'];
const ROBOT_CONDS=['сверху свободно','снизу свободно','слева свободно','справа свободно','сверху стена','снизу стена','слева стена','справа стена','клетка закрашена','клетка чистая','температура','радиация'];
const LET=/[A-Za-zА-Яа-яЁё_]/, WCH=/[A-Za-zА-Яа-яЁё_0-9]/;

function lex(src){
 const T=[];let i=0,line=1;const n=src.length;
 const push=(k,v)=>T.push({k,v,line,lv:k==='w'?v:undefined});
 while(i<n){const c=src[i];
  if(c==='\n'){push('nl');line++;i++;continue}
  if(c===' '||c==='\t'||c==='\r'||c==='\u00a0'){i++;continue}
  if(c==='|'){while(i<n&&src[i]!=='\n')i++;continue}
  if(c===';'){push('nl');i++;continue}
  if(c==='"'||c==="'"||c==='«'){const q=c==='«'?'»':c;let j=i+1,s='';while(j<n&&src[j]!==q&&src[j]!=='\n'){s+=src[j];j++}
   if(src[j]!==q)throw new KErr(line,'Не закрыта кавычка');push('s',s);i=j+1;continue}
  if(c>='0'&&c<='9'){const m=/^\d+(\.\d+)?([eE][+-]?\d+)?/.exec(src.slice(i,i+60));push('n',{v:parseFloat(m[0]),r:/[.eE]/.test(m[0])});i+=m[0].length;continue}
  if(LET.test(c)){let j=i+1;while(j<n&&WCH.test(src[j]))j++;push('w',src.slice(i,j));i=j;continue}
  const two=src.slice(i,i+2);
  if([':=','**','<=','>=','<>'].includes(two)){push('o',two);i+=2;continue}
  if('()[],:+-*/=<>'.includes(c)){push('o',c);i++;continue}
  if(c==='≤'||c==='≥'||c==='≠'){push('o',c==='≤'?'<=':c==='≥'?'>=':'<>');i++;continue}
  if(c==='×'){push('o','*');i++;continue}
  throw new KErr(line,'Непонятный символ «'+c+'»')}
 push('eof');return T}

function parse(src){
 const T=lex(src);let p=0;
 const t=()=>T[p], nx=()=>T[p++];
 const isW=(v,tk=t())=>tk.k==='w'&&tk.lv===v;
 const isO=(v,tk=t())=>tk.k==='o'&&tk.v===v;
 const isKw=tk=>tk.k==='w'&&KW.has(tk.lv);
 const err=(msg,tk=t())=>{throw new KErr(tk.line,msg)};
 const skipNl=()=>{while(t().k==='nl')p++};
 const desc=tk=>tk.k==='eof'?'конец программы':tk.k==='nl'?'конец строки':tk.k==='w'||tk.k==='o'?'«'+tk.v+'»':tk.k==='s'?'строка':'число';
 const expW=(v,msg)=>{if(!isW(v))err(msg||('Ожидалось «'+v+'», а встретилось '+desc(t())));return nx()};
 const expO=(v,msg)=>{if(!isO(v))err(msg||('Ожидалось «'+v+'», а встретилось '+desc(t())));return nx()};
 const name=(opt)=>{const ws=[];while(t().k==='w'&&!isKw(t()))ws.push(nx().v);if(!ws.length){if(opt)return '';err('Ожидалось имя, а встретилось '+desc(t()))}return ws.join(' ')};
 const typeAt=()=>{const tk=t();if(tk.k!=='w')return null;if(TABS[tk.lv])return{t:TABS[tk.lv],tab:true,n:1};if(TYPES[tk.lv]){const n2=T[p+1];if(n2&&n2.k==='w'&&n2.lv==='таб')return{t:TYPES[tk.lv],tab:true,n:2};return{t:TYPES[tk.lv],tab:false,n:1}}return null};

 /* выражения */
 function expr(){return orE()}
 function orE(){let a=andE();while(isW('или')){const ln=nx().line;a={k:'or',a,b:andE(),line:ln}}return a}
 function andE(){let a=notE();while(isW('и')){const ln=nx().line;a={k:'and',a,b:notE(),line:ln}}return a}
 function notE(){if(isW('не')){const ln=nx().line;return{k:'not',a:notE(),line:ln}}return cmpE()}
 function cmpE(){let a=addE();const tk=t();if(tk.k==='o'&&['=','<>','<','>','<=','>='].includes(tk.v)){nx();a={k:'bin',op:tk.v,a,b:addE(),line:tk.line}}return a}
 function addE(){let a=mulE();while(t().k==='o'&&(t().v==='+'||t().v==='-')){const tk=nx();a={k:'bin',op:tk.v,a,b:mulE(),line:tk.line}}return a}
 function mulE(){let a=unE();while((t().k==='o'&&(t().v==='*'||t().v==='/'))||((isW('div')||isW('mod'))&&!isO('(',T[p+1]))){const tk=nx();a={k:'bin',op:tk.k==='w'?tk.lv:tk.v,a,b:unE(),line:tk.line}}return a}
 function unE(){if(isO('-')){const ln=nx().line;return{k:'neg',a:unE(),line:ln}}if(isO('+')){nx();return unE()}return powE()}
 function powE(){const a=prim();if(isO('**')){const ln=nx().line;return{k:'bin',op:'**',a,b:unE(),line:ln}}return a}
 function args(){const r=[];expO('(');if(isO(')')){nx();return r}for(;;){r.push(expr());if(isO(',')){nx();continue}expO(')');return r}}
 function idx(){expO('[');const r=[];for(;;){const a=expr();if(isO(':')){nx();const b=expr();r.push({sl:true,a,b})}else r.push(a);if(isO(',')){nx();continue}expO(']');return r}}
 function prim(){const tk=t();
  if(tk.k==='n'){nx();return{k:'num',v:tk.v.v,line:tk.line}}
  if(tk.k==='s'){nx();return{k:'str',v:tk.v,line:tk.line}}
  if(isO('(')){nx();const e=expr();expO(')');return e}
  if(isW('да')||isW('нет')){nx();return{k:'bool',v:tk.lv==='да',line:tk.line}}
  if(isW('знач')){nx();return{k:'var',n:'знач',line:tk.line}}
  if((isW('div')||isW('mod'))&&isO('(',T[p+1])){nx();return{k:'call',n:tk.lv,args:args(),line:tk.line}}
  if(tk.k==='w'&&!isKw(tk)){const n=name();if(isO('('))return{k:'call',n,args:args(),line:tk.line};
   if(isO('[')){const ix=idx();return{k:'idx',n,ix,line:tk.line}}
   return{k:'var',n,line:tk.line}}
  err('Ожидалось значение, а встретилось '+desc(tk))}

 /* операторы */
 const CLOSERS=['кон','кц','кц_при','все','иначе','при'];
 function block(stops,eofOk){const list=[];
  for(;;){skipNl();const tk=t();
   const need=stops.includes('все')?'все':stops[0];
   if(tk.k==='eof'){if(stops.length&&!eofOk)err('Не хватает «'+need+'»');return list}
   if(tk.k==='w'&&stops.includes(tk.lv))return list;
   if(tk.k==='w'&&stops.length&&!eofOk&&CLOSERS.includes(tk.lv)&&!(tk.lv==='кон'&&stops.includes('кон')))err('Не хватает «'+need+'» перед «'+tk.v+'»');
   list.push(stmt())}}
 function decl(){const ty=typeAt();const ln=t().line;p+=ty.n;const items=[];
  for(;;){const n=name();let bounds=null,init=null;
   if(isO('[')){if(!ty.tab)err('Таблица описывается словом «'+ty.t+'таб»');nx();bounds=[];for(;;){const a=expr();expO(':');const b=expr();bounds.push([a,b]);if(isO(',')){nx();continue}expO(']');break}}
   else if(ty.tab)err('У таблицы нужно указать границы: '+n+'[1:10]');
   if(isO('=')||isO(':=')){nx();init=expr()}
   items.push({n,bounds,init});
   if(isO(',')){nx();if(typeAt())break;continue}break}
  const r={k:'decl',t:ty.t,tab:ty.tab,items,line:ln};
  if(isO(',')){}
  return r}
 function target(){const tk=t();if(isW('знач')){nx();return{n:'знач',line:tk.line}}const n=name();let ix=null;if(isO('['))ix=idx();return{n,ix,line:tk.line}}
 function stmt(){const tk=t(),ln=tk.line;
  if(typeAt()){const d=decl();
   while(isO(',')){nx();}
   return d}
  if(tk.k==='w')switch(tk.lv){
   case'ввод':{nx();const ts=[target()];while(isO(',')){nx();ts.push(target())}return{k:'in',ts,line:ln}}
   case'вывод':{nx();const items=[];for(;;){if(isW('нс')){nx();items.push(null)}else items.push(expr());if(isO(',')){nx();continue}break}return{k:'out',items,line:ln}}
   case'если':{nx();const c=expr();skipNl();expW('то');const a=block(['иначе','все']);let b=null;if(isW('иначе')){nx();b=block(['все'])}expW('все');return{k:'if',c,a,b,line:ln}}
   case'выбор':{nx();skipNl();const cs=[];let def=null;
    while(isW('при')){nx();const c=expr();expO(':');cs.push({c,body:block(['при','иначе','все'])})}
    if(!cs.length)err('После «выбор» нужно «при условие:»');
    if(isW('иначе')){nx();def=block(['все'])}expW('все');return{k:'sel',cs,def,line:ln}}
   case'нц':{nx();let L;
    if(isW('пока')){nx();L={k:'while',c:expr()}}
    else if(isW('для')){nx();const v=name();expW('от');const a=expr();expW('до');const b=expr();let s=null;if(isW('шаг')){nx();s=expr()}L={k:'for',v,a,b,s}}
    else if(t().k==='nl'||t().k==='eof')L={k:'loop'};
    else{const e=expr();expW('раз','После числа повторений нужно слово «раз»');L={k:'times',e}}
    L.body=block(['кц','кц_при']);L.line=ln;
    if(isW('кц_при')){nx();L.until=expr()}
    else{expW('кц');if(isW('при')){nx();L.until=expr()}}
    return L}
   case'выход':nx();return{k:'exit',line:ln};
   case'стоп':nx();return{k:'halt',line:ln};
   case'утв':{nx();return{k:'assert',c:expr(),line:ln}}
   case'знач':{nx();expO(':=');return{k:'set',tg:{n:'знач',line:ln},e:expr(),line:ln}}
   case'все':err('«все» без «если» или «выбор»');break;
   case'кц':case'кц_при':err('«'+tk.v+'» без «нц»');break;
   case'иначе':err('«иначе» без «если»');break;
   case'кон':err('«кон» без «нач»');break;
   case'нач':err('«нач» без «алг»');break;
   case'алг':err('Новый «алг» начат до «кон» предыдущего');break;
   case'то':err('«то» без «если»');break;
   case'при':err('«при» без «выбор»');break;
  }
  if(tk.k==='w'&&!isKw(tk)){const n=name();
   if(isO('[')||isO(':=')){let ix=null;if(isO('['))ix=idx();expO(':=','Ожидалось «:=»');return{k:'set',tg:{n,ix,line:ln},e:expr(),line:ln}}
   if(isO('='))err('Для присваивания пишут «:=», а не «=»');
   let a=[];if(isO('('))a=args();return{k:'call',n,args:a,line:ln}}
  err('Непонятная команда: '+desc(tk))}

 function alg(){const ln=expW('алг').line;let ret=null;const ty=typeAt();if(ty&&!ty.tab){ret=ty.t;p+=ty.n}
  const nm=name(true);const params=[];
  if(isO('(')){nx();let mode='арг',cur=null;
   for(;;){if(isW('арг')||isW('рез')||isW('аргрез')){mode=nx().lv;cur=null}
    const ty2=typeAt();if(ty2){cur={t:ty2.t,tab:ty2.tab};p+=ty2.n}
    if(!cur)err('У параметра нужно указать тип (цел, вещ, лог, лит, сим)');
    const n=name();if(isO('[')){idx();cur={t:cur.t,tab:true}}
    params.push({n,t:cur.t,tab:cur.tab,mode});
    if(isO(',')){nx();continue}expO(')');break}}
  while(t().k!=='nl'&&t().k!=='eof')err('Лишнее в строке алгоритма: '+desc(t()));
  skipNl();
  while(isW('дано')||isW('надо')){while(t().k!=='nl'&&t().k!=='eof')p++;skipNl()}
  expW('нач','После строки «алг» нужно «нач»');
  const body=block(['кон']);expW('кон');
  return{name:nm,ret,params,body,line:ln}}

 skipNl();let uses=[];
 while(isW('использовать')){nx();uses.push(name().toLowerCase());skipNl()}
 const intro=block(['алг'],true);const algs=[];
 skipNl();while(isW('алг')){algs.push(alg());skipNl();while(isW('использовать')){nx();uses.push(name().toLowerCase());skipNl()}}
 if(t().k!=='eof')err('Ожидался «алг», а встретилось '+desc(t()));
 const map=new Map();for(const a of algs){if(a.name&&map.has(a.name))throw new KErr(a.line,'Алгоритм «'+a.name+'» описан дважды');if(a.name)map.set(a.name,a)}
 let main=algs[0]||null;
 if(!main){main={name:'',ret:null,params:[],body:intro.splice(0),line:1}}
 return{intro,algs:map,main,uses}}

/* ---------- выполнение ---------- */
const EXIT={}, HALT={};
function fmt(v){if(typeof v==='boolean')return v?'да':'нет';if(typeof v==='number'){if(Number.isInteger(v))return String(v);return String(+v.toPrecision(10))}return String(v)}
function tname(v){return typeof v==='boolean'?'лог':typeof v==='number'?(Number.isInteger(v)?'цел':'вещ'):typeof v==='string'?'лит':'?'}

function exec(prog,io){
 const G={vars:new Map()};let steps=0,depth=0;
 const R=io.robot;
 const fail=(line,msg)=>{throw new KErr(line,msg)};
 function look(fr,n,line){const r=fr.vars.get(n)||G.vars.get(n);if(!r)fail(line,'Имя «'+n+'» не описано');return r}
 function coerce(t,v,line,n){
  if(v===undefined)fail(line,'Величина не имеет значения');
  switch(t){
   case'цел':if(typeof v!=='number')fail(line,'Нельзя присвоить '+tname(v)+' величине типа цел'+(n?' «'+n+'»':''));if(!Number.isInteger(v))fail(line,'Нельзя присвоить вещественное число целой величине'+(n?' «'+n+'»':''));if(Math.abs(v)>2147483647)fail(line,'Целое число слишком большое (переполнение)');return v;
   case'вещ':if(typeof v!=='number')fail(line,'Нельзя присвоить '+tname(v)+' величине типа вещ'+(n?' «'+n+'»':''));return v;
   case'лог':if(typeof v!=='boolean')fail(line,'Нужно логическое значение (да/нет)'+(n?' для «'+n+'»':''));return v;
   case'лит':if(typeof v!=='string')fail(line,'Нужна строка (лит)'+(n?' для «'+n+'»':''));return v;
   case'сим':if(typeof v!=='string'||v.length!==1)fail(line,'Нужен один символ (сим)'+(n?' для «'+n+'»':''));return v}
  return v}
 const num=(v,line)=>{if(typeof v!=='number')fail(line,'Нужно число, а получено '+(v===undefined?'пустое значение':tname(v)));return v};
 const bool=(v,line)=>{if(typeof v!=='boolean')fail(line,'Нужно условие (да/нет), а получено '+tname(v));return v};
 const int=(v,line)=>{num(v,line);if(!Number.isInteger(v))fail(line,'Нужно целое число');return v};
 const str=(v,line)=>{if(typeof v!=='string')fail(line,'Нужна строка');return v};
 function cell(rec,ix,fr,line){
  if(!rec.tab)fail(line,'«'+rec.n+'» — не таблица');
  if(ix.length!==rec.dims.length)fail(line,'У таблицы «'+rec.n+'» '+rec.dims.length+' '+(rec.dims.length===1?'индекс':'индекса'));
  let off=0;for(let k=0;k<ix.length;k++){const v=int(ev(ix[k],fr),line);const[lo,hi]=rec.dims[k];if(v<lo||v>hi)fail(line,'Индекс '+v+' вне границ таблицы «'+rec.n+'» ['+lo+':'+hi+']');off=off*(hi-lo+1)+(v-lo)}return off}
 const B={
  'sqrt':a=>{const x=num(a[0]);if(x<0)throw new KErr(0,'Корень из отрицательного числа');return Math.sqrt(x)},
  'abs':a=>Math.abs(num(a[0])),'iabs':a=>Math.abs(int(a[0])),'int':a=>Math.floor(num(a[0])),'sign':a=>Math.sign(num(a[0])),
  'div':a=>{const x=int(a[0]),y=int(a[1]);if(y===0)throw new KErr(0,'Деление на ноль');return Math.floor(x/y)},
  'mod':a=>{const x=int(a[0]),y=int(a[1]);if(y===0)throw new KErr(0,'Деление на ноль');return x-y*Math.floor(x/y)},
  'max':a=>Math.max(num(a[0]),num(a[1])),'min':a=>Math.min(num(a[0]),num(a[1])),'imax':a=>Math.max(int(a[0]),int(a[1])),'imin':a=>Math.min(int(a[0]),int(a[1])),
  'sin':a=>Math.sin(num(a[0])),'cos':a=>Math.cos(num(a[0])),'tg':a=>Math.tan(num(a[0])),'ctg':a=>1/Math.tan(num(a[0])),'arcsin':a=>Math.asin(num(a[0])),'arccos':a=>Math.acos(num(a[0])),'arctg':a=>Math.atan(num(a[0])),
  'ln':a=>Math.log(num(a[0])),'lg':a=>Math.log10(num(a[0])),'exp':a=>Math.exp(num(a[0])),
  'rnd':a=>Math.random()*num(a[0]),'irnd':a=>1+Math.floor(Math.random()*int(a[0])),'rand':a=>num(a[0])+Math.random()*(num(a[1])-num(a[0])),'irand':a=>int(a[0])+Math.floor(Math.random()*(int(a[1])-int(a[0])+1)),

const DB={db:null,mem:{},
 open(){return new Promise(res=>{try{const r=indexedDB.open('kabinet',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
 tx(mode,fn){return new Promise(res=>{try{const st=this.db.transaction('kv',mode).objectStore('kv');const r=fn(st);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
 get(k){return this.db?this.tx('readonly',s=>s.get(k)):Promise.resolve(this.mem[k])},
 set(k,v){if(!this.db){this.mem[k]=v;return Promise.resolve()}return this.tx('readwrite',s=>s.put(v,k))},
 del(k){if(!this.db){delete this.mem[k];return Promise.resolve()}return this.tx('readwrite',s=>s.delete(k))}
};

function cyrb(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
 return(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')}
function passHash(p,salt){let h=salt+p;for(let i=0;i<2000;i++)h=cyrb(h+salt+p,i);return h}

   if(!r.ok)throw new Error('cloud '+r.status);const t=await r.text();return t?JSON.parse(t):null}finally{clearTimeout(tm)}},
 info(s){const now=Date.now();return{v:1,name:s.name,tutor:S.settings.tutor,subjects:S.settings.subjects,hw:s.hw,

 queue(s){if(!this.on)return;clearTimeout(this.t[s.id]);this.t[s.id]=setTimeout(()=>this.pushInfo(s),2000)},
 async pushInfo(s){if(!this.on)return false;clearTimeout(this.t[s.id]);try{await this.rpc('kab_put',{p_token:s.token,p_key:this.wkey(),p_item:'info',p_data:this.info(s)});return true}catch(e){console.warn(e);return false}},

  try{await this.rpc('kab_put',{p_token:s.token,p_key:this.wkey(),p_item:'board:'+b.id,p_data:data});return true}catch(e){console.warn(e);return false}},
 del(s,item){if(!this.on)return;clearTimeout(this.t[s.id]);this.rpc('kab_del',{p_token:s.token,p_key:this.wkey(),p_item:item}).catch(()=>{})}

/* ---------- бесконечная доска ---------- */
const num=v=>typeof v==='number'&&isFinite(v);
function okItem(it){if(!it||typeof it!=='object'||typeof it.id!=='string')return false;
 if(it.t==='s')return Array.isArray(it.pts)&&it.pts.length<60000&&it.pts.every(num)&&num(it.w)&&typeof it.c==='string';
 if(it.t==='i')return typeof it.src==='string'&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(it.src)&&[it.x,it.y,it.w,it.h].every(num);
 if(it.t==='t')return typeof it.txt==='string'&&[it.x,it.y,it.s].every(num)&&typeof it.c==='string';
 if(it.t==='g')return['rect','circ','arrow'].includes(it.k)&&[it.x0,it.y0,it.x1,it.y1,it.w].every(num)&&typeof it.c==='string';
 return false}
const OX=800,OY=520;
const B={board:null,cur:0,tool:'pen',color:'#17141F',size:3,imgs:new Map(),undo:[],sel:null,live:null,buf:[],onSave:null,dirtyF:false,ro:false,view:'board',pid:null,
 views:[],cw:0,ch:0,dpr:1,ptrs:new Map(),gest:null,glock:false,space:false,curs:new Map(),
 clean(b){if(!b||typeof b!=='object'||!Array.isArray(b.pages)||!b.pages.length)b=emptyBoard();
  b.pages=b.pages.slice(0,200).map(p=>({bg:['grid','axes','none'].includes(p&&p.bg)?p.bg:undefined,items:(p&&Array.isArray(p.items)?p.items:[]).filter(okItem)}));
  const c=b.code&&typeof b.code==='object'?b.code:{};
  b.code={lang:c.lang==='kum'?'kum':'py',text:typeof c.text==='string'?c.text.slice(0,50000):'',stdin:typeof c.stdin==='string'?c.stdin.slice(0,20000):'',env:Kum.envClean(c.env)};
  return b},
 start(board,onSave,ro){
  this.board=this.clean(board);this.cur=0;this.onSave=onSave;this.ro=!!ro;this.tool='pen';this.color='#17141F';this.size=3;this.undo=[];this.sel=null;this.live=null;this.shapeP=null;this.drag=null;this.pid=null;this.dirtyF=false;this.view='board';this.imgs.clear();
  this.views=[];this.ptrs.clear();this.gest=null;this.glock=false;this.curs.clear();
  for(const n of['I','K','O'])this['k'+n]=$('#c'+n).getContext('2d');
  const o=$('#cO');o.onpointerdown=e=>this.down(e);o.onpointermove=e=>this.move(e);o.onpointerup=o.onpointercancel=e=>this.up(e);o.onpointerleave=()=>this.leave();
  o.addEventListener('wheel',e=>this.wheel(e),{passive:false});o.oncontextmenu=e=>e.preventDefault();
  const st=$('#stage');st.ondragover=e=>e.preventDefault();st.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)this.addFile(f)};
  if(!this.ro){$('#sz').oninput=e=>this.size=+e.target.value;
   $('#imgf').onchange=e=>{if(e.target.files[0])this.addFile(e.target.files[0]);e.target.value=''};
   $('#bgs').onchange=e=>this.doOp({op:'bg',p:this.cur,bg:e.target.value});
   const ti=$('#ti');ti.onkeydown=e=>{if(e.key==='Enter')this.commitText();if(e.key==='Escape'){ti.value='';ti.hidden=true}};ti.onblur=()=>this.commitText()}
  Code.init(this.ro);
  this.resize();
  Room.onResize=()=>this.resize();
 },
 page(){return this.board.pages[this.cur]},
 get v(){return this.views[this.cur]||(this.views[this.cur]=this.fitView())},
 find(p,id){const pg=this.board.pages[p];if(!pg)return null;for(let i=pg.items.length-1;i>=0;i--)if(pg.items[i].id===id)return pg.items[i];return null},
 img(it){let im=this.imgs.get(it.id);if(!im){im=new Image();im.onload=()=>this.schedule();im.src=it.src;this.imgs.set(it.id,im)}return im},
 bbox(items){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;const add=(a,b,m)=>{x0=Math.min(x0,a-m);y0=Math.min(y0,b-m);x1=Math.max(x1,a+m);y1=Math.max(y1,b+m)};
  for(const it of items){if(it.t==='s')for(let i=0;i<it.pts.length;i+=2)add(it.pts[i],it.pts[i+1],it.w/2);
   else if(it.t==='i'){add(it.x,it.y,0);add(it.x+it.w,it.y+it.h,0)}
   else if(it.t==='t'){add(it.x,it.y,0);add(it.x+it.txt.length*it.s*.6,it.y+it.s*1.2,0)}
   else if(it.t==='g'){if(it.k==='circ'){const r=Math.hypot(it.x1-it.x0,it.y1-it.y0);add(it.x0,it.y0,r+it.w)}else{add(it.x0,it.y0,it.w*3);add(it.x1,it.y1,it.w*3)}}}
  return x0===Infinity?null:{x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0)}},
 area(){const mob=window.innerWidth<=900;const vc=!this.ro&&$('#vcard')&&!$('#room').classList.contains('vmin')&&!mob;return{l:12,t:mob?110:64,r:vc?290:12,b:78}},
 fitView(r){r=r||this.bbox(this.page().items)||{x:0,y:0,w:1600,h:1000};const a=this.area(),aw=Math.max(100,this.cw-a.l-a.r),ah=Math.max(100,this.ch-a.t-a.b);
  let z=Math.min(aw/(r.w+60),ah/(r.h+60));let top=false;if(r.h>r.w*1.4&&aw/(r.w+60)>z*1.6){z=aw/(r.w+60);top=true}z=clamp(z,.1,2);
  return{x:r.x+r.w/2-(a.l+aw/2)/z,y:top?r.y-30-a.t/z:r.y+r.h/2-(a.t+ah/2)/z,z}},
 resize(){const st=$('#stage');if(!st)return;this.cw=st.clientWidth;this.ch=st.clientHeight;this.dpr=Math.min(2,window.devicePixelRatio||1);
  for(const n of['I','K','O']){const c=$('#c'+n),w=Math.round(this.cw*this.dpr),h=Math.round(this.ch*this.dpr);if(c.width!==w||c.height!==h){c.width=w;c.height=h}}
  this.render()},
 schedule(){if(document.hidden){this.render();return}if(!this.raf)this.raf=requestAnimationFrame(()=>{this.raf=0;this.render()})},
 setT(k){const v=this.v,d=this.dpr;k.setTransform(d*v.z,0,0,d*v.z,-v.x*v.z*d,-v.y*v.z*d)},
 clr(k){k.setTransform(1,0,0,1,0,0);k.clearRect(0,0,k.canvas.width,k.canvas.height)},
 render(){if(!$('#cO')||!this.board)return;this.renderImgs();this.renderInk();this.renderOver();
  const l=$('#pgl');if(l)l.textContent='Лист '+(this.cur+1)+' из '+this.board.pages.length;const s=$('#bgs');if(s)s.value=this.page().bg||'dots';const z=$('#zl');if(z)z.textContent=Math.round(this.v.z*100)+'%'},
 vrect(){const v=this.v;return{x0:v.x,y0:v.y,x1:v.x+this.cw/v.z,y1:v.y+this.ch/v.z}},
 bg(k,t,R,z){t=t||'dots';if(t==='none')return;
  let st=40;while(st*z<(t==='dots'?18:12))st*=2;
  const x0=OX+Math.floor((R.x0-OX)/st)*st,y0=OY+Math.floor((R.y0-OY)/st)*st;
  k.save();
  if(t==='dots'){k.fillStyle='#CFCBDC';const r=1.25/z;for(let x=x0;x<=R.x1;x+=st)for(let y=y0;y<=R.y1;y+=st)k.fillRect(x-r,y-r,2*r,2*r)}

 async delpage(){if(B.board.pages.length<2)return toast('Это единственный лист');const b=B.board,p=B.cur;if(await sure('Удалить лист '+(p+1)+'?','Всё, что на нём есть, пропадёт.','Удалить',true)&&Room.on&&B.board===b)B.doOp({op:'delpage',p})},
 zin(){B.zoomAt(B.cw/2,B.ch/2,1.25)},zout(){B.zoomAt(B.cw/2,B.ch/2,.8)},z100(){B.zoomAt(B.cw/2,B.ch/2,1/B.v.z)},fit(){B.setView(B.fitView())},
 look(){B.look()},
 view(el){const v=el.dataset.v;B.setMode(v);if(!B.ro)Net.send({op:'view',v})},
 vmin(el){const r=$('#room'),m=!r.classList.contains('vmin');r.classList.toggle('vmin',m);$('#vcard').classList.toggle('min',m);el.innerHTML=ic(m?'chev':'chevu');el.title=m?'Развернуть':'Свернуть'},
 lang(el){const c=B.board.code,v=el.dataset.v;if(c.lang===v||B.ro&&false)return;c.lang=v;if(v==='kum'&&!$('#code').value.trim()){$('#code').value=KUM_TPL;c.text=KUM_TPL}Run.rob=null;Run.robI=null;Code.load();Code.changed();Field.draw()},
 ckey(el){const k=el.dataset.k,ta=$('#code');if(ta.readOnly)return;ta.focus();if(/\(\)$/.test(k))Code.ins(k,1);else Code.ins(k+(/[:]$/.test(k)?'':' '))},
 run(){if(B.view!=='code')return;if(Run.on)return;Run.start()},
 stop(){Run.stop(true)},
 conclear(){if(Run.on)return;Run.segs=[];Run.len=0;Run.render();Run.flush(true)},
 envedit(el){Field.edit=!Field.edit;el.classList.toggle('act',Field.edit);$('#envtools').hidden=!Field.edit;if(Field.edit&&!Run.on){Run.rob=null;Run.robI=null}Field.draw()},
 envmode(el){Field.mode=el.dataset.v;$$('[data-a=envmode]').forEach(b=>b.classList.toggle('act',b===el))},
 async envclear(){if(!await sure('Очистить поле?','Стены, закраска и точки пропадут.','Очистить',true))return;const e=B.board.code.env;e.walls=[];e.paint=[];e.marks=[];Field.commit()},
 robreset(){if(Run.on)return;Run.rob=null;Run.robI=null;Field.draw();Net.send({op:'rob',st:B.board.code.env})},
 codecopy(){const t=$('#code').value;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Код скопирован'),()=>toast('Не получилось скопировать'));else{$('#code').select();toast('Выделено: нажмите Ctrl+C')}},
 mic(el){const t=Net.local&&Net.local.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;el.classList.toggle('off',!t.enabled);toast(t.enabled?'Микрофон включён':'Микрофон выключен',1200)},
 cam(el){const t=Net.local&&Net.local.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;el.classList.toggle('off',!t.enabled);toast(t.enabled?'Камера включена':'Камера выключена',1200)},
 async screen(el){if(Net.shareTrack){const t=Net.shareTrack;t.stop();if(t.onended)t.onended();return}
  if(!Call.pcs.size){toast('Показ экрана включается, когда собеседник на связи');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){toast('Этот браузер не умеет показывать экран');return}
  try{const ds=await navigator.mediaDevices.getDisplayMedia({video:true}),tr=ds.getVideoTracks()[0];Net.shareTrack=tr;for(const s of Call.videoSenders())await s.replaceTrack(tr);el.classList.add('act');
   tr.onended=()=>{Net.shareTrack=null;el.classList.remove('act');const cam=Net.local&&Net.local.getVideoTracks()[0];if(cam)for(const s of Call.videoSenders())s.replaceTrack(cam).catch(()=>{})}}catch(e){}}
};
function copyText(t){const ok=()=>toast('Ссылка скопирована'),man=()=>modal({title:'Скопируйте ссылку',input:true,value:t,readonly:true,ok:'Закрыть'});if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,man);else man()}
async function importAll(e){const f=e.target.files[0];e.target.value='';if(!f)return;let d;try{d=JSON.parse(await f.text());if(!d.state||!Array.isArray(d.state.students))throw 0}catch(err){return toast('Не получилось прочитать файл копии')}
 if(!await sure('Загрузить копию?','Текущие ученики и доски будут заменены данными из файла.','Заменить',true))return;
 S=norm(d.state);await saveNow();for(const id in d.boards||{})await DB.set('board:'+id,d.boards[id]);if(S.settings.pass)Lock.open();toast('Копия загружена');location.hash='#/';viewHome()}

document.addEventListener('click',e=>{const v=e.target.closest('#rv');if(v){v.classList.toggle('big');const p=v.play();if(p&&p.catch)p.catch(()=>{})}
 const el=e.target.closest('[data-a]');if(el&&!el.disabled&&A[el.dataset.a])A[el.dataset.a](el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('addcard'))A.addst()});
document.addEventListener('input',e=>{const d=e.target.dataset;if(!d||Room.on)return;if(d.f&&curS){curS[d.f]=e.target.value;touch(curS)}else if(d.g){S.settings[d.g]=e.target.value;saveS()}});
document.addEventListener('paste',e=>{if(!Room.on||B.ro||B.view!=='board'||!e.clipboardData||$('.modal'))return;const it=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));if(it){const f=it.getAsFile();if(f){e.preventDefault();B.addImage(f)}}});
const HOT={p:'pen',l:'line',a:'arrow',r:'rect',c:'circ',e:'eraser',t:'text',v:'select',h:'hand',з:'pen',д:'line',ф:'arrow',к:'rect',с:'circ',у:'eraser',е:'text',м:'select',р:'hand'};
document.addEventListener('keydown',e=>{if(!Room.on||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||$('.modal'))return;
 if(B.view!=='board')return;
 if(e.key===' '&&!B.space){B.space=true;$('#cO').style.cursor='grab';e.preventDefault();return}
 if(B.ro)return;
 if((e.key==='Delete'||e.key==='Backspace')&&B.sel){e.preventDefault();A.delsel()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();A.undo();return}
 if(!e.ctrlKey&&!e.metaKey&&!e.altKey){const t=HOT[e.key.toLowerCase()];if(t){A.tool($(`[data-t=${t}]`));return}if(e.key==='+'||e.key==='=')A.zin();if(e.key==='-')A.zout();if(e.key==='0')A.fit()}});
document.addEventListener('keyup',e=>{if(e.key===' '&&B.space){B.space=false;const o=$('#cO');if(o)o.style.cursor=''}});
window.addEventListener('pagehide',()=>{if(Room.on){B.flushSave();Net.stop()}if(saveT)saveNow()});

(async()=>{await DB.open();const st=await DB.get('state');if(st&&Array.isArray(st.students))S=st;norm(S);route()})();
</script>
